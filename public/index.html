<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<link rel="manifest" href="/manifest.webmanifest" />
<title>Licencias · DRV</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eef2ff;background:#070b16}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% -20%,#24315f 0,transparent 35%),#070b16}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}.brand h1{font-size:20px;margin:0}.brand p{margin:4px 0 0;color:#93a4c7;font-size:12px}.pill{border:1px solid #263251;background:#11182b;padding:8px 11px;border-radius:999px;font-size:12px}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,1fr)}.card{background:rgba(16,23,41,.93);border:1px solid #273351;border-radius:18px;padding:15px;box-shadow:0 14px 40px #0005}.stat b{font-size:25px;display:block}.stat span{font-size:11px;color:#95a4c4}.layout{grid-template-columns:380px 1fr;align-items:start}.card h2{font-size:15px;margin:0 0 12px}.field{margin:10px 0}.field label{font-size:11px;color:#9cabca;display:block;margin:0 0 6px}input,select,textarea{width:100%;background:#0b1120;border:1px solid #33405e;color:#eef2ff;border-radius:11px;padding:12px;outline:none}textarea{min-height:72px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:700;cursor:pointer;background:#375dfb;color:white}.btn.secondary{background:#1c2740}.btn.danger{background:#8d2634}.btn.good{background:#126442}.btn:disabled{opacity:.5}.actions{display:flex;gap:7px;flex-wrap:wrap}.result{margin-top:12px;padding:12px;border:1px dashed #405174;border-radius:12px;background:#0a1020;display:none}.result code{display:block;word-break:break-all;font-size:12px;color:#bbcdfc;margin-top:8px}.toolbar{display:flex;gap:8px;margin-bottom:10px}.toolbar input{flex:1}.list{display:grid;gap:9px;max-height:68vh;overflow:auto;padding-right:3px}.lic{border:1px solid #283654;background:#0a1120;border-radius:13px;padding:11px}.lic-top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.lic-name{font-weight:800}.muted{color:#8fa0c0;font-size:11px}.machine{font-family:ui-monospace,monospace;font-size:11px;color:#b8c6e7;margin:5px 0}.status{font-size:10px;padding:5px 8px;border-radius:999px;background:#1f3652}.status.revoked{background:#562634}.status.expired{background:#5c421e}.lic .actions{margin-top:9px}.lic .btn{padding:7px 9px;font-size:11px}.login{position:fixed;inset:0;background:#060914ee;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.loginbox{width:min(390px,100%)}.err{color:#ff9ca8;font-size:12px;margin-top:8px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#10192f;border:1px solid #344267;border-radius:999px;padding:10px 14px;font-size:12px;display:none;z-index:30}@media(max-width:820px){.stats{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.list{max-height:none}.wrap{padding:12px}.top{align-items:flex-start}.card{border-radius:15px}}
</style>
</head>
<body>
<div class="login" id="login"><div class="loginbox card"><h2>Panel privado de licencias</h2><p class="muted">Ingresa tu clave de administrador. Se guarda solo durante esta sesión.</p><div class="field"><label>Clave admin</label><input id="adminToken" type="password" autocomplete="current-password" /></div><button class="btn" onclick="login()">Entrar</button><div class="err" id="loginErr"></div></div></div>
<div class="wrap">
  <div class="top"><div class="brand"><h1>Licencias · DRV</h1><p>Generador móvil para tus bots</p></div><div class="pill" id="sessionBadge">Privado</div></div>
  <div class="grid stats">
    <div class="card stat"><b id="sTotal">0</b><span>Total</span></div><div class="card stat"><b id="sActive">0</b><span>Activas</span></div><div class="card stat"><b id="sExpired">0</b><span>Vencidas</span></div><div class="card stat"><b id="sRevoked">0</b><span>Revocadas</span></div>
  </div>
  <div class="grid layout" style="margin-top:12px">
    <section class="card"><h2>Nueva licencia</h2>
      <div class="field"><label>Cliente</label><input id="client" placeholder="Ej. Jair / Equipo auditoría" /></div>
      <div class="field"><label>Código de PC</label><input id="machine" autocapitalize="characters" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" /></div>
      <div class="field"><label>Bot</label><select id="bot"><option>CLARIDAD_DIGITADOR</option><option>PUBLICADOR_CLARIDAD</option><option>ORDENADOR_CLARIDAD</option><option>OTRO</option></select></div>
      <div class="row"><div class="field"><label>Duración</label><select id="days"><option value="15">15 días</option><option value="30" selected>30 días</option><option value="60">60 días</option><option value="90">90 días</option><option value="365">1 año</option></select></div><div class="field"><label>Fecha exacta (opcional)</label><input id="expires" type="date" /></div></div>
      <div class="field"><label>Notas</label><textarea id="notes" placeholder="Pago, contacto, observación..."></textarea></div>
      <button class="btn" id="genBtn" onclick="generate()">Generar clave</button>
      <div class="result" id="result"><div class="muted">Clave generada · vence <b id="resultExpiry"></b></div><code id="resultKey"></code><div class="actions" style="margin-top:10px"><button class="btn secondary" onclick="copyText(document.getElementById('resultKey').textContent)">Copiar clave</button><button class="btn secondary" onclick="shareKey()">Compartir</button></div></div>
    </section>
    <section class="card"><h2>Licencias</h2><div class="toolbar"><input id="search" placeholder="Buscar cliente o PC..." oninput="debouncedLoad()"/><button class="btn secondary" onclick="loadAll()">↻</button></div><div class="list" id="list"></div></section>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
let TOKEN=sessionStorage.getItem('drv_admin')||''; let lastKey=''; let debounceTimer;
const $=id=>document.getElementById(id);
function headers(){return {'content-type':'application/json','authorization':'Bearer '+TOKEN}}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{...headers(),...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(r.status===401){TOKEN='';sessionStorage.removeItem('drv_admin');$('login').style.display='flex';throw new Error('Sesión no autorizada')}if(!r.ok||j.ok===false)throw new Error(j.error||'Error');return j}
async function login(){TOKEN=$('adminToken').value.trim();sessionStorage.setItem('drv_admin',TOKEN);try{await loadAll();$('login').style.display='none';$('loginErr').textContent=''}catch(e){$('loginErr').textContent='Clave incorrecta o panel no configurado.'}}
async function generate(){const btn=$('genBtn');btn.disabled=true;try{const body={client_name:$('client').value,machine_code:$('machine').value,bot:$('bot').value,days:Number($('days').value),expires_on:$('expires').value,notes:$('notes').value};const j=await api('/api/generate',{method:'POST',body:JSON.stringify(body)});lastKey=j.license_key;$('resultKey').textContent=j.license_key;$('resultExpiry').textContent=j.expires_on;$('result').style.display='block';await loadAll();toast('Licencia generada')}catch(e){toast(e.message)}finally{btn.disabled=false}}
async function copyText(t){await navigator.clipboard.writeText(t);toast('Copiado')}
async function shareKey(){if(!lastKey)return;if(navigator.share){await navigator.share({title:'Licencia',text:lastKey})}else copyText(lastKey)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function effectiveStatus(x){if(x.status==='REVOKED')return 'REVOKED';return x.expires_on < new Date().toISOString().slice(0,10)?'EXPIRED':'ACTIVE'}
async function loadAll(){const q=encodeURIComponent($('search')?.value||'');const [s,l]=await Promise.all([api('/api/summary'),api('/api/licenses?q='+q)]);$('sTotal').textContent=s.summary.total||0;$('sActive').textContent=s.summary.active||0;$('sExpired').textContent=s.summary.expired||0;$('sRevoked').textContent=s.summary.revoked||0;$('list').innerHTML=(l.licenses||[]).map(x=>{const st=effectiveStatus(x);return `<div class="lic"><div class="lic-top"><div><div class="lic-name">${esc(x.client_name||'Sin nombre')}</div><div class="muted">${esc(x.bot)} · vence ${esc(x.expires_on)}</div></div><span class="status ${st==='REVOKED'?'revoked':st==='EXPIRED'?'expired':''}">${st}</span></div><div class="machine">${esc(x.machine_code)}</div><div class="muted">${esc(x.notes||'')}</div><div class="actions"><button class="btn secondary" onclick='copyText(${JSON.stringify(x.license_key)})'>Copiar</button><button class="btn good" onclick="renew(${x.id})">Renovar</button>${x.status==='REVOKED'?`<button class="btn secondary" onclick="activate(${x.id})">Activar</button>`:`<button class="btn danger" onclick="revoke(${x.id})">Revocar</button>`}</div></div>`}).join('')||'<div class="muted">Sin licencias todavía.</div>'}
function debouncedLoad(){clearTimeout(debounceTimer);debounceTimer=setTimeout(()=>loadAll().catch(()=>{}),250)}
async function renew(id){const days=prompt('¿Cuántos días para la nueva clave?','30');if(!days)return;try{const j=await api(`/api/licenses/${id}/renew`,{method:'POST',body:JSON.stringify({days:Number(days)})});lastKey=j.license_key;await copyText(j.license_key);await loadAll();toast('Renovada y copiada')}catch(e){toast(e.message)}}
async function revoke(id){if(!confirm('¿Marcar esta licencia como revocada?'))return;try{await api(`/api/licenses/${id}/revoke`,{method:'POST'});await loadAll();toast('Revocada')}catch(e){toast(e.message)}}
async function activate(id){try{await api(`/api/licenses/${id}/activate`,{method:'POST'});await loadAll();toast('Activada')}catch(e){toast(e.message)}}
if(TOKEN){loadAll().then(()=>$('login').style.display='none').catch(()=>{})}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body></html>
